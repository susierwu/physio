[project]
name = "physio_asst"
version = "0.1.0"
description = "AI-powered physiotherapy diagnosis assistant (Streamlit + Gemini + DeepSeek + OpenAI)"
readme = "README.md"
authors = [{ name = "Susie", email = "sw.susdata@gmail.com" }]
requires-python = ">=3.9"

dependencies = [
    # --- Web interface ---
    "streamlit>=1.32.0",

    # --- AI model providers ---
    "google-generativeai==0.8.5",     # Gemini
    "openai>=1.10.0",                 # OpenAI / GPT
    #"deepseek-ai>=0.1.0",            # DeepSeek via openAI

    # --- Data & visualization ---
    "pandas",
    "numpy",
    "matplotlib",
    "plotly",
    "requests",
    "pillow",

    # --- Compatibility fix (critical) ---
    "protobuf<4,>=3.20.3"
]

[project.scripts]
physio_asst = "physio_asst.main:main"

[tool.uv]
package = true
